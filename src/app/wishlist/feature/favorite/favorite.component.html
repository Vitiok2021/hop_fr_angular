<h2>Мій список обраних:</h2>

<div
  class="favorite-grid"
  style="
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 20px;
  "
>
  @for(product of favoriteProducts();track product.id){
  <app-product-card [inputData]="product"> </app-product-card>
  } @empty {
  <div class="empty-state">
    <p>Тут поки порожньо. Добавте щось</p>
  </div>
  }
</div>
